<section class="contact-band" id="contact">
  <div class="container contact-inner">
    <div>
      <h2>{{contact_title}}</h2>
      <p>{{contact_sub}}</p>
    </div>
    <div class="contact-actions">
      <a class="btn btn-primary" href="tel:{{company.phoneHref}}">{{company.phone}}</a>
      <a class="btn btn-ghost" href="tel:{{company.mobileHref}}">Viber / WhatsApp / Telegram</a>
    </div>
  </div>
</section>
