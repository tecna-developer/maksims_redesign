<a class="skip-link" href="#main">{{skip_to_content}}</a>

<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="{{url_index}}" aria-label="{{aria_logo_home}}">
      <picture>
        <source srcset="{{asset}}logo-maksims-light.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="{{asset}}logo-maksims-burgundy.svg" alt="{{company.displayName}}" width="264"
          height="86">
      </picture>
      <!-- Parked: copy lives in common._archive.tagline. To restore, move the key
           up out of _archive (all three languages) and uncomment.
      <span class="brand-tag">{{tagline}}</span>
      -->
    </a>

    <nav aria-label="{{aria_main_nav}}">
      <ul class="primary-nav">
        <li><a href="{{url_ettevottest}}" {{current_ettevottest}}>{{nav_about}}</a></li>
        <li><a href="{{url_teenused}}" {{current_teenused}}>{{nav_services}}</a></li>
        <li><a href="{{url_uudised}}" {{current_uudised}}>{{nav_news}}</a></li>
        <li><a href="{{url_kontakt}}" {{current_kontakt}}>{{nav_contact}}</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a class="phone-link" href="tel:{{company.phoneHref}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
        </svg>
        <span>{{company.phone}}</span>
      </a>
      {{{langSwitch}}}
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mobileNav"
        aria-label="{{aria_open_menu}}" data-label-open="{{aria_open_menu}}" data-label-close="{{aria_close_menu}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
          aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="{{aria_mobile_nav}}">
    <a href="{{url_ettevottest}}" {{current_ettevottest}}>{{nav_about}}</a>
    <a href="{{url_teenused}}" {{current_teenused}}>{{nav_services}}</a>
    <a href="{{url_uudised}}" {{current_uudised}}>{{nav_news}}</a>
    <a href="{{url_kontakt}}" {{current_kontakt}}>{{nav_contact}}</a>
    <a href="tel:{{company.phoneHref}}">{{company.phone}}</a>
  </nav>
</header>
