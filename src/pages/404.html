{{> header}}

<main id="main" class="not-found-page">
  <section class="not-found-section">
    <div class="container not-found-content">
      <div class="not-found-code" aria-hidden="true">404</div>
      <div class="eyebrow">{{page_eyebrow}}</div>
      <h1>{{page_title}}</h1>
      <p>{{page_intro}}</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="{{url_index}}">{{home_cta}}</a>
        <a class="btn btn-ghost" href="{{url_kontakt}}">{{contact_cta}}</a>
      </div>
    </div>
  </section>
</main>

{{> footer}}
